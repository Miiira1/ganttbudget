# Automatické nasazení na GitHub Pages (N-13).
#
# Po každém push do větve main GitHub na svém počítači:
#   1. stáhne kód a nainstaluje knihovny přesně podle package-lock.json (npm ci),
#   2. spustí testy a build – když cokoli selže, nic se nenasadí,
#   3. nahraje složku dist/ na GitHub Pages.
# U pull requestů se jen spustí testy a build (bez nasazení).
#
# Akce jsou připnuté na přesný otisk verze (SHA), ne na značku @v4 – značku může autor akce
# přesunout jinam, otisk ne (audit, doporučení). Aktualizace navrhuje Dependabot (dependabot.yml).
# Ručně jde spustit v záložce Actions → „Nasazení na GitHub Pages“ → Run workflow.
name: Nasazení na GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nejmenší možná oprávnění; nasazovací krok si přidá jen to, co potřebuje.
permissions:
  contents: read

# Běží vždy jen jedno nasazení; novější push to starší nepřeruší uprostřed.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Testy a build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Příprava webu pro Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    name: Nasazení
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write # nahrát web na GitHub Pages
      id-token: write # ověřit, že nasazení přichází z tohoto repozitáře
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
